<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank you — Optivium</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <meta name="robots" content="noindex" />
  <style>
    .thankyou-wrap{
      min-height:100vh; display:grid; place-items:center;
      padding: clamp(48px, 8vh, 96px) 1rem; position:relative; z-index:1; text-align:center;
    }
    .thankyou-card{
      background: rgba(26,28,30,0.75);
      backdrop-filter: blur(10px);
      border:1px solid var(--border);
      border-radius: 12px;
      padding: clamp(1.5rem, 3vw, 2.25rem);
      max-width: 720px; width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .icon-check{
      width:64px; height:64px; margin: 0 auto 1rem; display:block;
      filter: drop-shadow(0 0 8px rgba(0,174,239,.35));
    }
    .thankyou-title{
      font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 800; margin:.25rem 0 .5rem;
    }
    .thankyou-sub{
      color: var(--muted-foreground); margin: 0 0 1.25rem 0;
      font-size: clamp(1rem, 2.5vw, 1.125rem);
    }
    .next-steps{ list-style:none; padding:0; margin: 0 0 1.5rem 0; color: var(--muted-foreground); }
    .next-steps li{ margin:.35rem 0; }
    .btns{ display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center; }
    .btns a{ text-decoration:none; padding:.875rem 1.25rem; border-radius:8px; font-weight:600; border:2px solid transparent; }
    .btns a.primary{ background: var(--accent); color:#fff; border-color: var(--accent); }
    .btns a.primary:hover{ background: var(--accent-hover); border-color: var(--accent-hover); }
    .btns a.secondary{ color: var(--accent); border-color: var(--accent); background: transparent; }
    .btns a.secondary:hover{ color: var(--accent-hover); border-color: var(--accent-hover); background: var(--accent-light); }
    @media (prefers-reduced-motion: reduce){ .thankyou-card{ backdrop-filter: none; } }
  </style>
</head>
<body>
  <!-- Matrix/Binary rain background -->
  <canvas id="binary-rain" style="position:fixed; inset:0; z-index:-1; pointer-events:none;"></canvas>

  <main class="thankyou-wrap">
    <section class="thankyou-card" aria-labelledby="ty-title">
      <!-- Accent check icon -->
      <svg class="icon-check" viewBox="0 0 48 48" aria-hidden="true" role="img">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7fe8ff"/>
            <stop offset="1" stop-color="#00aeef"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="22" fill="none" stroke="url(#grad)" stroke-width="3"/>
        <path d="M16 24.5l5.2 5.2L32.5 18" fill="none" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <h1 id="ty-title" class="thankyou-title">Thank you for your inquiry!</h1>
      <p class="thankyou-sub">We’ve received your message and will reach out shortly.</p>

      <ul class="next-steps">
        <li>Check your inbox for a confirmation.</li>
        <li> Optional: reply to our email with any docs or examples.</li>
      </ul>

      <div class="btns">
        <a class="primary" href="/">Back to Home</a>
      </div>
    </section>
  </main>

  <script src="assets/js/binary-rain.js"></script>
</body>
</html>
